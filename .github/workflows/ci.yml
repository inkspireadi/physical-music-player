name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos/PhysicalMusicPlayer
    steps:
      - uses: actions/checkout@v4
      - run: swift build
